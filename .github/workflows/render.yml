# Renders the daily trivia post whenever a new jobs/<name>/trivia.json is pushed to the
# kit branch, then rewrites the posts branch as one commit holding that job's files
# plus the previous 7 days' folders:
#   <name>/slide1_question.png ... short.mp4, preview.png, trivia.json
# The daily Claude task polls the posts branch, then schedules the files in Metricool.
name: Render trivia post

on:
  push:
    branches: [kit]
    paths: ["jobs/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-trivia
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find the newest job
        id: job
        run: |
          f=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'jobs/*/trivia.json' 2>/dev/null | sort | tail -1 || true)
          if [ -z "$f" ]; then f=$(ls -1 jobs/*/trivia.json 2>/dev/null | sort | tail -1 || true); fi
          if [ -z "$f" ]; then echo "No jobs/<name>/trivia.json to render; nothing to do."; exit 0; fi
          name=$(basename "$(dirname "$f")")
          case "$name" in *[!A-Za-z0-9._-]*|"") echo "bad job name: $name"; exit 1;; esac
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Rendering $f"

      - name: Install ffmpeg, emoji font, Pillow, numpy
        if: steps.job.outputs.name != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji > /dev/null
          python3 -m pip install --quiet --break-system-packages pillow numpy

      - name: Render slides and Short
        if: steps.job.outputs.name != ''
        env:
          JOB_FILE: ${{ steps.job.outputs.file }}
          JOB_NAME: ${{ steps.job.outputs.name }}
        run: |
          python3 render_slides.py "$JOB_FILE" "out/$JOB_NAME" --video
          cp "$JOB_FILE" "out/$JOB_NAME/trivia.json"
          ls -la "out/$JOB_NAME"

      - name: Publish to the posts branch
        if: steps.job.outputs.name != ''
        env:
          JOB_NAME: ${{ steps.job.outputs.name }}
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # Keep the last 7 days of folders so a post's links keep working if renders overlap.
          mkdir -p keep
          if git fetch -q --depth 1 origin posts 2>/dev/null; then git archive FETCH_HEAD | tar -x -C keep; fi
          cutoff=$(date -u -d '7 days ago' +%Y-%m-%d)
          for d in keep/*/; do
            [ -d "$d" ] || continue
            n=$(basename "$d")
            [ "$n" = "$JOB_NAME" ] && continue
            [[ "${n:0:10}" < "$cutoff" ]] && continue
            mv "$d" out/
          done
          cd out
          git init -q
          git checkout -q -b posts
          git config user.name "Sports Plus Trivia"
          git config user.email "sportsplusdenver-bot@users.noreply.github.com"
          git add .
          git commit -q -m "Rendered $JOB_NAME"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" posts
